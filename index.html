<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leo Shop</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./fontawesom/css/all-fonts.min.css" />
  </head>
  <body>
    <!-- header elements -->
    <header class="header">
      <nav class="nav-box">
        <a href="#"><img src="./icon.png" alt="icon" class="hero-icon" /></a>

        <div class="search-box">
          <input type="search" placeholder="search..." class="search-input" />
          <span class="search-icon">
            <i class="fa fa-search"></i>
          </span>
        </div>

        <ul class="header-list">
          <li class="header-item">
            <a href="">
              <i class="fa fa-solid fa-comment"></i>
              about
            </a>
          </li>

          <li class="header-item">
            <a href="">
              <i class="fa fa-solid fa-home"></i>
              home
            </a>
          </li>

          <li class="header-item">
            <a href="/login.html">
              <i class="fa fa-solid fa-user"></i>
              login
            </a>
          </li>
        </ul>

        <span class="burger-menu">
          <i class="fa fa-bars"></i>
        </span>

        <div class="wrapper"></div>
      </nav>
    </header>
    <!-- main -->
    <main class="main">
      <div class="erro-load">
        <div class="loading-gif">
          <img src="./Infinity@1x-1.0s-237px-237px.gif" alt="loading gif" />
        </div>
        <h2 class="error-text"></h2>
      </div>

      <div class="container"></div>
    </main>
    <!-- footer -->
    <footer class="footer">
      <div class="footer-details">
        <h2 class="footer-title">Leo Shop</h2>
        <p class="footer-descrip">Simple thing , beautifully made.</p>
        <div class="footer-icons">
          <a href="#" class="icon">
            <i class="fa fa-brands fa-instagram"></i>
          </a>
          <a href="#" class="icon">
            <i class="fa fa-brands fa-telegram"></i>
          </a>
          <a href="#" class="icon">
            <i class="fa fa-brands fa-whatsapp"></i>
          </a>
          <p class="contact-txt">contact to us</p>
        </div>
      </div>

      <p class="cioy-right-txt">&copy;Leo Shop - All Rights Reserved</p>
    </footer>

    <!-- link js -->

    <script src="./main.js"></script>
